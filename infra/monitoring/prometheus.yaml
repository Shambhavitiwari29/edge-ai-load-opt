apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "decision-engine"
        static_configs:
          - targets:
              - "decision-engine.default.svc.cluster.local:8082"

Save → close.

